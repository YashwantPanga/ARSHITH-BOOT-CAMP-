<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/codelekho-app-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/codelekho-app-icon-32.png" />
    <link rel="apple-touch-icon" href="/codelekho-app-icon-180.png" />
    <meta name="theme-color" content="#013A2B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeLekho — Learn Today, Build Tomorrow | Online Learning Platform</title>
    <meta name="description" content="Practical courses taught by industry experts. Learn Python, Web Development, Data Science, SQL & AI at your own pace and earn verifiable certificates." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Jost:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Inline so the splash paints before the bundle loads */
      #arb-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#FBF8F1;transition:opacity .5s ease,visibility .5s ease}
      #arb-splash.hide{opacity:0;visibility:hidden}
    </style>
  </head>
  <body class="antialiased font-sans">
    <div id="arb-splash" class="splash" role="status" aria-label="Loading CodeLekho">
      <div class="arb-loader" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <rect class="cl-glow" width="100" height="100" rx="22.4" />
          <rect class="cl-tile" width="100" height="100" rx="22.4" />
          <polyline class="cl-br cl-br-l" points="31.2,35.4 19.2,50 31.2,64.6" />
          <polyline class="cl-br cl-br-r" points="68.8,35.4 80.8,50 68.8,64.6" />
          <path class="cl-ink" d="M38 77 L62 77" />
          <g class="cl-nib">
            <path d="M51.22 34.47 C52.19 32.06 54.92 30.9 57.32 31.87 C59.73 32.84 60.89 35.58 59.92 37.98 C52.89 55.38 46.61 63.39 42.68 68.13 C43.13 61.99 44.18 51.87 51.22 34.47Z" />
            <circle cx="51.46" cy="46.37" r="1.43" />
            <line x1="50.4" y1="48.9" x2="44.7" y2="63" />
          </g>
        </svg>
      </div>
      <div class="splash-word" aria-hidden="true"><span style="animation-delay:.05s">C</span><span style="animation-delay:.1s">o</span><span style="animation-delay:.15s">d</span><span style="animation-delay:.2s">e</span><span class="lk" style="animation-delay:.25s">L</span><span class="lk" style="animation-delay:.3s">e</span><span class="lk" style="animation-delay:.35s">k</span><span class="lk" style="animation-delay:.4s">h</span><span class="lk" style="animation-delay:.45s">o</span></div>
      <div class="splash-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
